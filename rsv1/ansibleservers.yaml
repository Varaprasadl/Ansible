- name: cretae ec2 instance & r53 records
  hosts: local
  connection: local
  
  vars:
    ami: "ami-0055977a6e828a4f4"
    domain_name: "kamesh.store"
    instance: [ mongodb ,redis ]
    type: "create"
  tasks:
  - name: create EC2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      instance_type: "t3.micro"
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      image_id: "{{ami}}"
      state: present
    loop: "{{instance}}"
    register: ec2_output
    when: type=="create"

  - name: delete EC2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      instance_type: "t3.micro"
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      image_id: "{{ami}}"
      state: absent
    loop: "{{instance}}"
    when: type=="delete"

  - name: print ec2 ec2_output
    debug:
      msg: "{{ec2_output}}"

