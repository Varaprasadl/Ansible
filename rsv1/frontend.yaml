- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: disable and enable nginx
    command: dnf module disable nginx -y

  - name: disable and enable nginx
    command: dnf module enable nginx:1.26 -y

  - name: install nginx
    package:
      name: nginx
      state: present

  - name: start & enable nginx
    service:
      name: nginx
      state: started
      enabled: yes

  - name: remove default countDocuments
    shell: rm -rf /usr/share/nginx/html/*