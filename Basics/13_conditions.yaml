- name: conditions
  hosts: local
  connection: local
  vars:
    given_number: 11
  tasks:
  - name: conditions 1
    debug:
      msg: "{{given_number}} is even"
    when: "{{given_number}}%2==0"

  - name: conditions 2
    debug:
      msg: "{{given_number}} is odd"
    when: "{{given_number}}%2!=0"