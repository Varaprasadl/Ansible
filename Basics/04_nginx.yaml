#ansible-playbook -i inventory.ini -e ansible_user=ec2-user -e ansible_password=DevOps321 04_nginx.yaml


- name: install and start nginx
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    package:
      name: nginx
      state: present
    service:
      name: nginx
      state: started
      enabled: yes
