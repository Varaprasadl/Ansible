- name: data types
  hosts: local
  connection: local
  vars:
    course: DevSecOps
    duration: 4 months
    live_session: yes
    content:
    - linux
    - shell
    - ansible
    - ide
    - teraaform
    traineer:
      shiva
      10 years experiance
  tasks:
  - name: variables
    debug:
      msg: |
        name: {{course}}:{{course|type_debug}}
        duration: {{duration}}:{{duration|type_debug}}
        live_session: {{live_session}}:{{live_session|type_debug}}
        content: {{content}}:{{content|content_debug}}
        traineer: {{traineer}}:{{traineer|content_debug}}
